<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proquiritations Animation</title>
<style>
:root { --bg:#17140f; --ink:#ece6da; --dim:#6f665a; --accent:#e9945f; --hl:rgba(251,231,168,.13); --hl-edge:rgba(251,231,168,.35); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#000; overflow:hidden; }
#frame { position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform-origin:0 0; background:var(--bg); overflow:hidden;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color:var(--ink); }
#frame::before,#frame::after { content:""; position:absolute; left:0; right:0; height:260px; z-index:2; pointer-events:none; }
#frame::before { top:0; background:linear-gradient(var(--bg),transparent); }
#frame::after { bottom:0; background:linear-gradient(transparent,var(--bg)); }
#strip { position:absolute; left:0; top:0; width:100%; will-change:transform; }
.item { display:flex; align-items:center; gap:70px; padding:70px 150px; opacity:.28; transition:opacity .25s; }
.item.on { opacity:1; }
.num { flex:0 0 250px; text-align:right; font:400 120px/1 "Iowan Old Style",Palatino,Georgia,serif; font-variant-numeric:tabular-nums; color:var(--dim); transition:color .25s; }
.item.on .num { font-weight:900; font-size:190px; color:var(--accent); }
.body { flex:1; padding:22px 34px; border-radius:18px; border:2px solid transparent; font-size:40px; line-height:1.4; transition:background .25s,border-color .25s; }
.item.on .body { background:var(--hl); border-color:var(--hl-edge); }
.sig { display:block; margin-top:10px; text-align:right; font-style:italic; color:var(--dim); font-size:32px; }
.item.on .sig { color:var(--accent); }
#panel { position:fixed; left:0; right:0; bottom:0; height:52px; z-index:10; background:#111; color:#ddd; font:13px/1.2 -apple-system,Helvetica,Arial,sans-serif;
  display:flex; align-items:center; gap:18px; padding:0 14px; border-top:1px solid #333; }
#panel.hidden { display:none; }
#panel .row { display:flex; gap:5px; }
#panel button { padding:4px 10px; cursor:pointer; }
#panel .ctl { display:flex; align-items:center; gap:8px; white-space:nowrap; }
#panel input[type=range] { width:160px; }
#panel .v { display:inline-block; min-width:52px; color:#aaa; }
#panel small { color:#777; margin-left:auto; white-space:nowrap; }
</style>
</head>
<body>
<div id="frame"><div id="strip"></div></div>
<div id="panel">
  <div class="row"><button id="play">Start</button><button id="prev">&#9664;</button><button id="next">&#9654;</button><button id="restart">Restart</button></div>
  <div class="ctl">Scroll time <input type="range" id="scroll" min="0" max="3000" step="10"><span class="v" id="vs"></span></div>
  <div class="ctl">Time per item <input type="range" id="dwell" min="0" max="15000" step="50"><span class="v" id="vd"></span></div>
  <label class="ctl"><input type="checkbox" id="loop"> Loop</label>
  <small>Space: play/pause &middot; &larr;/&rarr;: step &middot; H: hide bar</small>
</div>
<script>
const PROQ = [{"n": 1, "sig": "K. F.", "lines": ["Seeing, from the creation of the world it hath pleased the Author to deduce his", "extraction, without baulking since the days of Adam so much as one of his progeni-", "tors on the paternal side—that the said Author may be put in a consistence of protract-", "ing his posterity through as many hereditary successors in a lineal descent, according", "to the contents of the preceding Tractate, is the desire of"]}, {"n": 2, "sig": "P. O.", "lines": ["Seeing the grant of what is demanded in this Treatise can no way introduce a", "preparative of any dangerous consequence, as hath been evidently shewn in the above", "written introduction—that it may be thought expedient, without any suspicion of", "being troubled upon the like grounds by any other of this Island, to condescend to his", "desires therein, is the hearty wish of"]}, {"n": 3, "sig": "N. Wa.", "lines": ["Seeing the covenanters, who are at this time accounted the State’s adversaries,", "kept, some three yeers ago, a garison in the Author's house for the space of a twelve-", "month ; and that, for these many yeers past, by several exactions, tolerated plunder-", "ings, and other such like unmerciful dealings, without any just occasion given, his", "rents have been made almost totally unserviceable—that he may now, for his greater", "peace in the future, be exonered of the English garison which is in his house, and,", "after its removal, have himself fully setled in his own, with all maner of ease and", "tranquility, is the humble desire of"]}, {"n": 4, "sig": "B. H.", "lines": ["That to the overthrow of equity in the person of the Author, the rigour of a", "wrested law be not permitted to become the executioner of the spleen and covetous-", "ness of his implacable adversaries, is the earnest desire of"]}, {"n": 5, "sig": "Yo. Bn.", "lines": ["That the Shire of Cromartie, which ever from the beginning hath been the re-", "ceptacle of the most harmless inhabitants, be not bestowed on any other then the", "Author, whose predecessors, for uprightness and integrity of carriage, were not, if", "equalled, inferiour to the best of any nation, is the longing desire of"]}, {"n": 6, "sig": "Bu· Ts.", "lines": ["That the Author being as a clear spark from whence gleameth the greatest part", "of the pure light that is to be seen of any learned invention in that country of Scot-", "land, it be not quenched and quite extinguished by the foul and black water of an", "usurious puddle, drunk up there by too many of the natives almost of all sorts, is the", "humble request of"]}, {"n": 7, "sig": "D. J.", "lines": ["That they who look meerly to the present time, without any regard of the", "future, be not permitted to deprive him of his means, who for the good of after-ages", "employs his spare hours most vertuously, is the true desire of"]}, {"n": 8, "sig": "E. G.", "lines": ["That those who, long before the distractions of Scotland, had enslaved them-", "selves to the abominable vice of oppressing others, be not permitted, now that by their", "means that country is brought lowe, to meddle with the estate of him who never in-", "jured any, is the earnest suit of"]}, {"n": 9, "sig": "X. Ya.", "lines": ["Seeing he is born to the profit of few, who thinketh onely on the people of his", "age ; and to that of fewer, whose thoughts exceed not the reach of his own proper", "interest—that due consideration may be had of the difference betwixt the Author's", "competitors of dark and narrow projects, and his own splendid and ample endeavours,", "comprehensive by appearance of the whole latitude of time, is the strong desire of"]}, {"n": 10, "sig": "Ai. Bs.", "lines": ["That outlandish nations, where the Author’s fame dwells advantagiously with", "an expansed reputation, will most highly extol the restorers of him to his own, for an", "act of perfect and well-principled generosity, is the confident opinion of"]}, {"n": 11, "sig": "V. Fs.", "lines": ["Seeing there is none, considering the relations and tyes whereunto the Author", "by nature and duty was bound, can with any shew of reason be accounted more blame-", "less then he—that he have his sequestration taken off, his person no longer detained", "as a prisoner of war, and some competent acknowledgement allowed him for the great", "loss he hath sustained by the rigour of the unmerciful, not to say knavish, subseques-", "trator, is the real desire of"]}, {"n": 12, "sig": "Ei. Z.", "lines": ["Seeing the Author's treatises are conducible to posterity, for the benefit where-", "of the most splendid states and potentates do usually undergo great hazards and diffi-", "culties—that out of respect to succeeding ages, and hope of their due retribution in", "praises, he may be better rewarded then if he were a present time-server, without con-", "sideration of the future, is the humble suit of"]}, {"n": 13, "sig": "A. S.", "lines": ["That he whose good name is like to be eternized to following ages, after that", "unto nature he hath paid the due which mortality will require of him, shall not in his", "life-time have his just demands denied by that authority whose representators upon", "equity promise to lay the foundation of an immortal fame, is the hope of"]}, {"n": 14, "sig": "Gh. En.", "lines": ["That the Author's family being one of the greatest antiquity in Scotland, and by", "an especial providence until this time preserved from that utter subversion intended by", "the iniquity of his covetous and dissembled enemies, should obtain, cæteris paribus, as", "large a measure of protection as any other race in the whole Isle of Britain, and him-", "self favoured with the grant of all that in his foregoing Treatise is demanded by him,", "is the real wish of"]}, {"n": 15, "sig": "Wh. Y.", "lines": ["Seeing the Author hath been still faithful to his trust, never culpable of parol-", "breaking, but always true in every word and action—that the discretion of the present", "authority will not suffer him to be exposed to the inhumane dealing of those country-", "men of his who for their own ends make no bones of being guilty of greater breaches,", "is the hearty wish of"]}, {"n": 16, "sig": "T. Wi.", "lines": ["That the power now in being will not permit that to be exposed to sale which", "never hitherto was made vendible in any preceding age, and that the lands and Shire", "of Cromartie, which by none that ever breathed were either bought or sold, should,", "by a peculiar grant paramount, be in the heritable possession of the Author, as neerest", "in line and by descent to the aborigenary owner, is the earnest request of"]}, {"n": 17, "sig": "Wo. Kn.", "lines": ["The Author having been very often, with an applause hinc inde, conversant", "both abroad and within the four seas, and sometimes for several months together, with-", "out the variety of any other company, with many choice English gentlemen—that by", "any supreme authority of that nation he should be singled out to suffer as much as the", "most inveterate disaffecters, out of a national antipathy, of both their rule and country-", "men, is not the expectation of"]}, {"n": 18, "sig": "C. W.", "lines": ["That the reasons deduced by the Author in the above written Treatise, why he", "should not be made liable to any other debt then that of his own contracting, may be", "so relished by [those] in whose power it is to make them effectual, as that thereby he", "may be forthwith exonered of any other burthen, is the earnest wish of"]}, {"n": 19, "sig": "M. Gs.", "lines": ["Seeing the Author’s unwillingness to pin his faith implicitly to the sleeve of", "the ministery, or to the single backless tenets in Ecclesiasticis of any church-man", "whatsoever, did exclude him from military charges in their covenanting armies ; and", "that therefore, having at no time been under their banner, he by all appearance should", "be looked upon with the more amicable eye by those who did reduce their unlimited", "power, is the humble opinion of"]}, {"n": 20, "sig": "L. Ch.", "lines": ["There being none in Scotland less covetous then he, nor more averse from the", "excessive love of money—that it may please those, in whom the power of protection is,", "so to protect him, as that he be not made a prey to the most avaritious men of any,", "and such as respect silver and gold beyond whatever else is most precious in the world,", "is the request of"]}, {"n": 21, "sig": "V. Ye.", "lines": ["That the Author's aversness from acknowledging an ecclesiastical soveraignty", "above the lawful supreme authority in civilibus, be not a motive to deal more rigorous-", "ly with him then with those time-servers who turn tail to every government, without", "bearing affection to any, is the suit of"]}, {"n": 22, "sig": "Q. O.", "lines": ["There being very few gentlemen in his condition, who to the press so freely", "adventure their names on subjects of any elaboured strain—that the Author's thus fa-", "vouring this Island with elucubrations beyond the reach of his competitors, be not met", "for that his publike service with such a permissive attolerance or connivence from the", "State, as might hurry upon him most grievous detriments by his own country-men in", "his private fortunes, is the cordial desire of"]}, {"n": 23, "sig": "Du. Th.", "lines": ["That the exemplary civility of the Author, for being apt to have influence on", "the mindes of the rudest of his kindred and neighbours, even unto the remotest hills", "of Scotland, may be of efficacy to perswade such amicable spirits at the helm of pub-", "like affairs, as would heartily endeavour the bringing of the two nations into as strict", "an union and neer conformity in laws, liberties, priviledges, customs, maners, and", "language, as is possible and expedient, to settle and stablish him in the inheritance", "of his predecessors, is the opinion of"]}, {"n": 24, "sig": "Au. Ps.", "lines": ["That sublime, natural, and moral philosophy, mathematicks, poesie, and many", "other kindes of good literature, should not be any longer supprest by the injustice of", "devouring and insatiable seekers, ignorant of every thing that is not lucrative for the", "bag, is the cordial request of"]}, {"n": 25, "sig": "Gu. Du.", "lines": ["Seeing many in all the corners almost of this Island live at ease, who enjoy", "more of their neighbour's unlawfully-acquired goods, then formerly they had of their", "own—that the Author, who never yet could, for the importunity of waspish seekers,", "and terrour of a rigorous law, most often in the mouthes, or at the disposure of par-", "tial men, get applied in the most fertile yeer that was, for his own use, the tenth part", "of his rents, should now by a paramount magnificence, reap the fruits of his own", "meanes, without the hazard of such terrible soakers, is the vehement desire of"]}, {"n": 26, "sig": "Yi. Pn.", "lines": ["Seeing the Author’s designes have been for these many yeers, the same, in", "matter of furthering manufactures and commerce, together with all maner of trading", "and negotiation, with the most industrious of England and other nations—that the", "present authority will not, in favour of those that have obstructed the performance of", "so worthy enterprises, denude him of his just inheritance, is the real hope of"]}, {"n": 27, "sig": "Tm. Ou.", "lines": ["As the overthrow of vice should be the establishment of vertue—that the reduc-", "ing of his opposers into a more narrow sphere of action then that wherein formerly", "they were wont to bestir themselves, should make the Author to be reseated in the in-", "heritance of his ancestors, by those who hitherto have professed the subdument of irre-", "gular spirits, is the confident expectation of"]}, {"n": 28, "sig": "R. Yu.", "lines": ["That the vexation uncessantly for these ten yeers past, sustained by the author", "from men of unsatisfiable appetites, in matter of worldly means, may not, as formerly,", "to the great hinderance of divulging treatises conducible to posterity, be any longer", "an impediment unto him, is the cordial wish of"]}, {"n": 29, "sig": "Gn. We.", "lines": ["As the love of goodness more then money, deserveth a larger influence of", "grace—so, that the Author's affection to the equitable customs and innate civility of the", "English nation, being of a more generous temper then that sullen and selfish disposi-", "tion in many others, which doth no longer relish their conversation then it is found", "apt to shore up the advantage of some pecuniary interest, may be regarded with an", "eye of greater favour, is the hearty request of"]}, {"n": 30, "sig": "Tu. J.", "lines": ["Seeing there are many gentlemen of considerable estates, who, though actually", "in charge against the English, as pretended opposers of Presbytery, did either enrich", "themselves, or by their levies and quarterings in the Kirk’s service, received great", "profits, to the no small damage of the country, do nevertheless, and that justly too,", "enjoy their means at this time, which good fortune notwithstanding in them I wish no", "man to envie, with as much tranquillity as before—that the Author, who never yet", "had any benefit to the prejudice of another, be placed, if not in a better, at least, ac-", "cording to the rules of distributive justice, in an equal condition with any of those, is", "the real expectation of"]}, {"n": 31, "sig": "Wu. Fn.", "lines": ["That a plenary grant of the Author’s demands, after the manner above specified", "in this noble Tractate of his Introduction, will prove a great encouragement to good", "spirits, and hinderance to none in the prosecuting of vertuous endeavours, is the sted-", "fast and firm opinion of"]}, {"n": 32, "sig": "Tn. Vs.", "lines": ["That this is the unanimous desire, wish, request, suit, opinion, hope, and ex-", "pectation of all the good persons of either sexe, with whom of any nation, in whatever", "country, whether at home or abroad, the Author hath been formerly acquainted, is", "duely testified and affirmed by"]}];
const KEEP = new Set(["twelve-","parol-","country-"]);
function join(lines){
  let t="";
  lines.forEach((l,i)=>{
    if(i===0){t=l;return;}
    if(/[A-Za-z]-$/.test(t)){
      const last=t.split(/\s+/).pop().toLowerCase().replace(/[^a-z-]/g,"");
      t = KEEP.has(last) ? t+l : t.slice(0,-1)+l;
    } else t+=" "+l;
  });
  return t;
}
const frame=document.getElementById("frame"), strip=document.getElementById("strip");
const VH=1080;
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
strip.innerHTML=PROQ.map(p=>`<div class="item"><div class="num">${p.n}</div><div class="body">${esc(join(p.lines))}<span class="sig">— ${esc(p.sig)}</span></div></div>`).join("");
const items=[...strip.children];
function fit(){ const bar=document.getElementById("panel").classList.contains("hidden")?0:52, h=innerHeight-bar;
  const k=Math.min(innerWidth/1920,h/1080);
  frame.style.left=(innerWidth-1920*k)/2+"px"; frame.style.top=(h-1080*k)/2+"px"; frame.style.transformOrigin="0 0"; frame.style.transform=`scale(${k})`; }
addEventListener("resize",fit); fit();
const targetY=i=>VH/2-(items[i].offsetTop+items[i].offsetHeight/2);
let y=targetY(0), cur=-1, playing=false, timer=null, raf=null;
const set=v=>{y=v;strip.style.transform=`translateY(${v}px)`;};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const $=id=>document.getElementById(id);
const cfg={scroll:300,dwell:2000};
try{Object.assign(cfg,JSON.parse(localStorage.getItem("proqcfg")||"{}"));}catch(e){}
function syncUI(){ $("scroll").value=cfg.scroll; $("dwell").value=cfg.dwell; $("vs").textContent=cfg.scroll+" ms"; $("vd").textContent=(cfg.dwell/1000).toFixed(2)+" s";
  try{localStorage.setItem("proqcfg",JSON.stringify(cfg));}catch(e){} }
$("scroll").oninput=e=>{cfg.scroll=+e.target.value;syncUI();};
$("dwell").oninput=e=>{cfg.dwell=+e.target.value;syncUI();};
syncUI();
function mark(i){ items.forEach((el,k)=>el.classList.toggle("on",k===i)); }
function goTo(i,instant){
  cancelAnimationFrame(raf); cur=i; mark(i);
  const from=y,to=targetY(i),d=instant?0:cfg.scroll;
  if(d<=0){set(to);return Promise.resolve();}
  return new Promise(res=>{ const t0=performance.now();
    const step=now=>{ const t=Math.min(1,(now-t0)/d); set(from+(to-from)*ease(t)); if(t<1) raf=requestAnimationFrame(step); else res(); };
    raf=requestAnimationFrame(step); });
}
function schedule(){
  clearTimeout(timer);
  if(!playing) return;
  timer=setTimeout(()=>{
    let n=cur+1;
    if(n>=PROQ.length){ if($("loop").checked) n=0; else { stop(); return; } }
    goTo(n,n===0&&cur>0&&false).then(schedule);
  },cfg.dwell);
}
function start(){ playing=true; $("play").textContent="Pause"; if(cur<0) goTo(0,true); schedule(); }
function stop(){ playing=false; clearTimeout(timer); $("play").textContent=cur>=PROQ.length-1?"Replay":"Start"; if(cur>=0&&cur<PROQ.length-1)$("play").textContent="Resume"; }
$("play").onclick=()=>{ if(playing) stop(); else { if(cur>=PROQ.length-1) cur=-1; start(); } };
$("restart").onclick=()=>{ clearTimeout(timer); cur=-1; goTo(0,true); playing=true; $("play").textContent="Pause"; schedule(); };
const step=d=>{ const n=Math.max(0,Math.min(PROQ.length-1,cur+d)); clearTimeout(timer); goTo(n).then(schedule); };
$("next").onclick=()=>step(1); $("prev").onclick=()=>step(-1);
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"&&e.target.type==="range"&&e.key.startsWith("Arrow")) e.target.blur();
  if(e.code==="Space"){e.preventDefault();$("play").click();}
  else if(e.key==="ArrowRight")step(1); else if(e.key==="ArrowLeft")step(-1);
  else if(e.key==="h"||e.key==="H")$("panel").classList.toggle("hidden");fit();
});
set(targetY(0)); mark(0);
</script>
</body>
</html>
