<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Processing</title>
<!--
  A computer screen working through a queue of tasks. Every task is an icon, a progress bar and a status mark.
  Before it moves, each task "thinks": its card is circled by a travelling light, a thought bubble with bouncing
  dots appears, and the bar only scans back and forth. Then the bar advances in fits and starts, stops to think again
  (the bubble pops back up) and finally snaps to full, turns green and gets a check mark.
  There is no readable text anywhere on the screen: only symbols, icons, bars and dots.

  Everything is a pure function of the clock t, so the page can be scrubbed, paused or frozen at any moment.
  Sound: a soft bed of "processing" noises (fan-like whirr, data ticks, little bloops while it thinks, relay thunks,
  a quick confirm chirp for every check) is embedded in this file. It is off until you press Sound (or M), because
  browsers do not allow sound to start by itself. It follows the clock: pause, scrub, speed and loop carry it along.

  Keys: Space pause/play, R replay, <- / -> seek 5 s, M sound on/off, H hide controls, F fullscreen.
  URL:  ?t=SECONDS freezes at that moment (for stills), ?loop=1 loops (with a fade), ?speed=2 sets the speed,
        ?sound=1 switches sound on (it starts at your first click or key press), ?bar=0 hides / ?bar=1 pins the controls.
  Everything is drawn in code or embedded, so this file works offline.
-->
<style>
  :root { --bg:#12161d; --panel:#1b212b; --ink:#e6ecf7; --muted:#8c98ad; --rule:#2c3646; --accent:#4f8dff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#000; }
  body.idle { cursor:none; }
  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:14px;
    padding:8px 14px; background:rgba(27,33,43,.88); border:1px solid var(--rule); border-radius:10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition:opacity .5s; max-width:calc(100vw - 20px);
    overflow-x:auto; white-space:nowrap; }
  body.idle #bar, body.nobar #bar { opacity:0; pointer-events:none; }
  #bar button { font:inherit; color:var(--ink); background:#252d3a; border:1px solid var(--rule); border-radius:6px; padding:5px 11px; cursor:pointer; flex-shrink:0; }
  #bar button:hover { background:#303a4b; }
  #bar label { display:flex; align-items:center; gap:7px; color:var(--muted); flex-shrink:0; }
  #bar output { color:var(--ink); min-width:3.2em; font-variant-numeric:tabular-nums; }
  #bar input[type=range] { accent-color:var(--accent); }
  #seek { width:300px; } #spd { width:100px; }
  #tt { min-width:7em; text-align:center; flex-shrink:0; }
  #bar small { color:var(--muted); flex-shrink:0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <button id="pause" title="Space">Pause</button>
  <button id="replay" title="R">Replay</button>
  <input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Timeline">
  <output id="tt">0:00</output>
  <label>Speed <input id="spd" type="range" min="0.25" max="4" step="0.05" value="1"><output id="spdv">1.0×</output></label>
  <label><input id="loop" type="checkbox"> Loop</label>
  <button id="snd" title="M" aria-pressed="false">Sound: off</button>
  <button id="fs" title="F">Fullscreen</button>
  <small>H hides controls</small>
</div>

function drawSidebar(t, a) {

/* ---------------------------------------------------------------- the room: wall, desk, monitor (cached) */

{ const t0 = parseFloat(params.get("t")); if (!isNaN(t0)) { simT = clamp(t0, 0, T_TOTAL); paused = true; pauseBtn.textContent = "Play"; } }
