<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks for watching!</title>
<!--
  "Thanks for watching!" outro. One big title that never stops drifting a little, and three small animated icons that
  arrive exactly where the narration asks for them:

    "Please let me know in the COMMENTS ..."          -> a speech bubble: typing dots, lines of text, a reply, a heart
    "... by LIKING and SUBSCRIBING."                  -> a thumbs-up that springs up with a burst, then the subscribe
                                                         button: a hand clicks it, the logo pops and the bell rings
                                                         (both drawn from the supplied artwork, embedded as layers)
    "See you next time!"                              -> nothing else on screen; the letters wave goodbye

  Narration (for reference):
    Thanks for watching! Please let me know in the comments what you think of this story, and the role of AI in
    codebreaking. Which cryptographic mysteries do you want to see solved by AI next? As always, you can help support
    this channel by liking and subscribing. See you next time!

  TIMING. The cue times below (CUES) are estimates for a natural narrator (about 23 s in all). To line the icons up
  with a real recording, edit CUES, or stretch everything with ?pace=1.1 (slower narrator) / ?pace=0.9 (faster).

  Everything is a pure function of the clock t, so the page can be scrubbed, paused or frozen at any moment.
  Keys: Space pause/play, R replay, <- / -> seek 5 s, H hide controls, F fullscreen.
  URL:  ?t=SECONDS freezes at that moment (for stills), ?loop=1 loops (with a fade), ?speed=2 sets the speed,
        ?pace=1.1 stretches the narration cues, ?bar=0 hides / ?bar=1 pins the controls.
  Everything is drawn in code, so this file works offline.
-->
<style>
  :root { --bg:#12161d; --panel:#1b212b; --ink:#e6ecf7; --muted:#8c98ad; --rule:#2c3646; --accent:#6fa8ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--ink); overflow:hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#000; }
  body.idle { cursor:none; }
  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:14px;
    padding:8px 14px; background:rgba(27,33,43,.88); border:1px solid var(--rule); border-radius:10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition:opacity .5s; max-width:calc(100vw - 20px);
    overflow-x:auto; white-space:nowrap; }
  body.idle #bar, body.nobar #bar { opacity:0; pointer-events:none; }
  #bar button { font:inherit; color:var(--ink); background:#252d3a; border:1px solid var(--rule); border-radius:6px; padding:5px 11px; cursor:pointer; flex-shrink:0; }
  #bar button:hover { background:#303a4b; }
  #bar label { display:flex; align-items:center; gap:7px; color:var(--muted); flex-shrink:0; }
  #bar output { color:var(--ink); min-width:3.2em; font-variant-numeric:tabular-nums; }
  #bar input[type=range] { accent-color:var(--accent); }
  #seek { width:300px; } #spd { width:100px; }
  #tt { min-width:7em; text-align:center; flex-shrink:0; }
  #bar small { color:var(--muted); flex-shrink:0; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar">
  <button id="pause" title="Space">Pause</button>
  <button id="replay" title="R">Replay</button>
  <input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Timeline">
  <output id="tt">0:00</output>
  <label>Speed <input id="spd" type="range" min="0.25" max="4" step="0.05" value="1"><output id="spdv">1.0×</output></label>
  <label><input id="loop" type="checkbox"> Loop</label>
  <button id="fs" title="F">Fullscreen</button>
  <small>H hides controls</small>
</div>

<script>
"use strict";
(() => {
/* ---------------------------------------------------------------- helpers */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const EASE  = { io: u => u * u * (3 - 2 * u), out: u => 1 - (1 - u) * (1 - u) };
const backOut = (u, c1 = 1.7) => { u = clamp(u, 0, 1); const c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const col = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];

/* ---------------------------------------------------------------- the narration: when each thing happens (seconds, natural narrator) */
const LEAD = .7, PACE = clamp(parseFloat(params.get("pace")) || 1, .5, 2);
const cue = t => LEAD + (t - LEAD) * PACE;
const CUES = {
  thanks:     cue(.7),      // "Thanks for watching!"
  comment:    cue(4.15),    // "... in the COMMENTS"                      speech bubble arrives
  commentOut: cue(14.95),   // after "... solved by AI next?"             speech bubble leaves
  like:       cue(19.15),   // "... by LIKING"                            thumbs-up arrives
  sub:        cue(20.05),   // "... and SUBSCRIBING."                     the button arrives next to it
  iconsOut:   cue(22.0),    // as "See you next time!" begins             both leave
  seeYou:     cue(21.75),   // "See you next time!"                       the letters wave goodbye
};
const T_TOTAL = cue(23.2) + 1.8;

/* ---------------------------------------------------------------- the title */
const LINES = ["Thanks for", "watching!"];
const FONT = s => `800 ${s}px "Arial Rounded MT Bold","Avenir Next Rounded","Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif`;
const cvs = $("c"), ctx = cvs.getContext("2d");
let K = 1, TL = null;                                                  // TL: laid-out letters with pre-rendered sprites
const GOLD = [255, 226, 168], WHITE = [255, 250, 240], ICE = [188, 226, 255];
function layoutTitle(pxScale) {
  let size = 280; ctx.font = FONT(size);
  const maxW = 1560, wMax = Math.max(...LINES.map(l => ctx.measureText(l).width)); if (wMax > maxW) size *= maxW / wMax;
  ctx.font = FONT(size);
  const track = size * .012, letters = []; let idx = 0, widest = 0;
  const lines = LINES.map(l => {
    const chars = []; let width = 0;
    for (let i = 0; i < l.length; i++) { const x = ctx.measureText(l.slice(0, i)).width + i * track, w = ctx.measureText(l.slice(0, i + 1)).width - ctx.measureText(l.slice(0, i)).width; chars.push({ ch: l[i], x, w }); width = x + w; }
    widest = Math.max(widest, width); return { chars, width };
  });
  const pad = size * .3, sp = pxScale;
  lines.forEach((ln, li) => ln.chars.forEach(c => {
    if (c.ch === " ") { c.idx = idx++; c.sprite = null; return; }
    const wS = Math.ceil((c.w + pad * 2) * sp), hS = Math.ceil((size * 1.5 + pad * 2) * sp), mkSprite = fn => { const cv = document.createElement("canvas"); cv.width = wS; cv.height = hS; const g = cv.getContext("2d"); g.scale(sp, sp); g.font = FONT(size); g.textBaseline = "alphabetic"; fn(g, pad, pad + size * 1.1); return cv; };
    const u = clamp((ln.chars.indexOf(c) / Math.max(1, ln.chars.length - 1)) * .7 + li * .3, 0, 1), base = u < .5 ? mixc(GOLD, WHITE, u * 2) : mixc(WHITE, ICE, (u - .5) * 2);
    c.sprite = mkSprite((g, x, y) => {                                 // glow, drop shadow, then the crisp letter
      g.shadowColor = "rgba(120,170,255,.55)"; g.shadowBlur = size * .22; g.fillStyle = col(base); g.fillText(c.ch, x, y);
      g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = size * .07; g.shadowOffsetY = size * .035; g.fillText(c.ch, x, y);
      g.shadowColor = "transparent"; g.fillStyle = col(base); g.fillText(c.ch, x, y);
    });
    c.bright = mkSprite((g, x, y) => { g.fillStyle = "#fff"; g.fillText(c.ch, x, y); });
    c.padX = pad; c.padY = pad + size * 1.1; c.wS = wS / sp; c.hS = hS / sp; c.idx = idx++;
  }));
  return { size, lines, pad, count: idx, L: size * .98 };
}
const presence = t => {                                                // the title makes room while an icon is on screen
  const win = (a, b) => sstep(a - .3, a + .7, t) * (1 - sstep(b, b + .9, t));
  return Math.max(win(CUES.comment, CUES.commentOut), win(CUES.like, CUES.iconsOut));
};
function drawTitle(t) {
  if (!TL) return;
  const { size, lines, count, L } = TL, pres = presence(t), yc = lerp(540, 388, EASE.io(pres));
  const bye = sstep(CUES.seeYou - .2, CUES.seeYou + .6, t) * (1 - sstep(T_TOTAL - 1.6, T_TOTAL, t));      // the goodbye wave
  ctx.save();
  ctx.translate(960 + 9 * Math.sin(t * .33), yc + 5 * Math.sin(t * .47));
  const br = 1 + .012 * Math.sin(t * .7); ctx.scale(br, br);
  lines.forEach((ln, li) => {
    ln.chars.forEach(c => {
      if (!c.sprite) return;
      const i = c.idx, u = clamp((t - (.25 + i * .05)) / .55, 0, 1); if (u <= 0) return;
      const amp = 7 + 5 * bye, hop = bye > 0 ? -34 * Math.max(0, Math.sin(Math.PI * clamp((t - CUES.seeYou - i * .05) / .7, 0, 1))) : 0;
      const dy = amp * Math.sin(t * 1.35 + i * .52) + (1 - EASE.out(u)) * 70 + hop;
      const rot = .013 * Math.sin(t * .95 + i * .71) + (1 - EASE.out(u)) * -.16, sc = (.55 + .45 * backOut(u)) * (1 + .012 * Math.sin(t * 1.1 + i * .43));
      const xc = -ln.width / 2 + c.x + c.w / 2, yb = (li === 0 ? -.23 : .75) * size;
      ctx.save(); ctx.translate(xc, yb + dy); ctx.rotate(rot); ctx.scale(sc, sc);
      ctx.globalAlpha = sstep(0, .35, u); ctx.drawImage(c.sprite, -c.w / 2 - c.padX, -c.padY, c.wS, c.hS);
      const sheen = Math.pow(Math.max(0, Math.sin(t * .9 - xc / 380 + li * .6)), 7) * .55 * sstep(0, .35, u); if (sheen > .01) { ctx.globalAlpha = sheen; ctx.drawImage(c.bright, -c.w / 2 - c.padX, -c.padY, c.wS, c.hS); }
      ctx.restore();
    });
  });
  ctx.restore();
}

/* ---------------------------------------------------------------- the three icons (each drawn around its own origin) */
const BLUE = [78, 160, 255], BLUE2 = [58, 118, 240], AMBER = [255, 196, 64], AMBER2 = [255, 140, 40], RED = [255, 74, 82], RED2 = [214, 34, 62], INK = [26, 34, 66], GREY = [124, 140, 176];
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function lin(g, x0, y0, x1, y1, a, b) { const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, col(a)); gr.addColorStop(1, col(b)); return gr; }
const state = (inT, outT, t, pop = .5) => {                            // arrival / departure of an icon
  const u = t - inT; if (u < 0) return null; const e = sstep(outT, outT + .45, t); if (e >= 1) return null;
  return { u, a: (1 - e) * sstep(0, .18, u), s: Math.max(.001, backOut(u / pop) * (1 - .4 * e)), dy: 26 * e };
};

/* --- comment: a speech bubble that gets typed into, a reply, and a heart */
function bubblePath(g, w, h, r, side) {
  const x0 = -w / 2, y0 = -h / 2, x1 = w / 2, y1 = h / 2, tx = side < 0 ? x0 + r * 1.5 : x1 - r * 1.5;
  g.beginPath(); g.moveTo(x0 + r, y0); g.lineTo(x1 - r, y0); g.arcTo(x1, y0, x1, y0 + r, r); g.lineTo(x1, y1 - r); g.arcTo(x1, y1, x1 - r, y1, r);
  if (side < 0) { g.lineTo(tx + 40, y1); g.lineTo(tx - 36, y1 + 52); g.lineTo(tx - 22, y1); } else { g.lineTo(tx + 22, y1); g.lineTo(tx + 36, y1 + 52); g.lineTo(tx - 40, y1); }
  g.lineTo(x0 + r, y1); g.arcTo(x0, y1, x0, y1 - r, r); g.lineTo(x0, y0 + r); g.arcTo(x0, y0, x0 + r, y0, r); g.closePath();
}
function lines(g, spec, u, alpha, full, ink, lw) {
  spec.w.forEach((len, k) => { const pr = full ? 1 : EASE.out(clamp((u - (spec.t0 + .42 * k)) / .5, 0, 1)); if (pr <= 0) return;
    g.globalAlpha = alpha; g.strokeStyle = col(ink); g.lineWidth = lw; g.lineCap = "round"; g.beginPath(); const y = spec.y0 + k * spec.gap; g.moveTo(spec.x0, y); g.lineTo(spec.x0 + len * pr, y); g.stroke(); g.globalAlpha = 1; });
}
function bubbleContent(g, u, ph, ink, lw, t) {
  let k = 0; ph.forEach((p, i) => { if (u >= p.start) k = i; }); const p = ph[k], prev = ph[k - 1];
  if (prev) { const f = 1 - clamp((u - p.start) / .35, 0, 1); if (f > 0) lines(g, prev.lines, u, f, true, ink, lw); }
  if (u >= p.dots[0] && u < p.dots[1] + .2) { const a = sstep(p.dots[0], p.dots[0] + .2, u) * (1 - sstep(p.dots[1], p.dots[1] + .2, u));
    for (let j = 0; j < 3; j++) { const b = Math.max(0, Math.sin(t * 7.5 - j * .9)); g.globalAlpha = a * (.55 + .45 * b); g.fillStyle = col(ink); g.beginPath(); g.arc(p.dotX + (j - 1) * p.dotGap, p.dotY - 13 * b, p.dotR * (1 + .12 * b), 0, TAU); g.fill(); g.globalAlpha = 1; } }
  lines(g, p.lines, u, 1, false, ink, lw);
}
const PH1 = [{ start: 0, dots: [.55, 1.9], dotX: 0, dotY: 0, dotGap: 70, dotR: 16, lines: { t0: 1.9, w: [210, 236, 150], x0: -118, y0: -46, gap: 46 } },
             { start: 8.0, dots: [8.4, 9.5], dotX: 0, dotY: 0, dotGap: 70, dotR: 16, lines: { t0: 9.5, w: [176, 232, 120], x0: -118, y0: -46, gap: 46 } }];
const PH2 = [{ start: 0, dots: [4.4, 5.6], dotX: 0, dotY: 0, dotGap: 62, dotR: 14, lines: { t0: 5.6, w: [150, 170], x0: -88, y0: -22, gap: 44 } }];
function drawComment(g, u, t) {
  const p1 = backOut(u / .55), p2 = backOut((u - 3.9) / .5);
  const bob = 5 * Math.sin(t * 1.7);
  if (p1 > .001) { g.save(); g.translate(-100 * EASE.io(sstep(3.6, 4.4, u)), -22 + bob); g.scale(p1, p1); g.rotate((1 - p1) * -.14);
    g.save(); g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 30; g.shadowOffsetY = 12; bubblePath(g, 304, 212, 74, -1); g.fillStyle = lin(g, 0, -106, 0, 106, BLUE, BLUE2); g.fill(); g.restore();
    g.save(); bubblePath(g, 304, 212, 74, -1); g.clip(); const hl = g.createLinearGradient(0, -106, 0, 0); hl.addColorStop(0, "rgba(255,255,255,.22)"); hl.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = hl; g.fillRect(-160, -110, 320, 120); g.restore();
    bubbleContent(g, u, PH1, [255, 255, 255], 19, t);
    // a heart lands on the comment
    const hu = (u - 7.2) / .55; if (hu > 0) { const s = backOut(hu, 2.2) * (1 + .06 * Math.sin(t * 6)); g.save(); g.translate(128, -108); g.scale(s, s); g.rotate(.18); g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 14; g.shadowOffsetY = 5;
      g.fillStyle = lin(g, 0, -44, 0, 44, [255, 110, 150], [236, 50, 96]); g.beginPath(); g.moveTo(0, 38); g.bezierCurveTo(-60, -6, -28, -52, 0, -22); g.bezierCurveTo(28, -52, 60, -6, 0, 38); g.fill(); g.restore(); }
    g.restore(); }
  if (p2 > .001) { g.save(); g.translate(128, 66 - bob * .8); g.scale(p2 * .8, p2 * .8); g.rotate((1 - p2) * .14);
    g.save(); g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 30; g.shadowOffsetY = 12; bubblePath(g, 304, 212, 74, 1); g.fillStyle = lin(g, 0, -106, 0, 106, [255, 255, 255], [222, 232, 252]); g.fill(); g.restore();
    bubbleContent(g, u, PH2, INK.map((v, i) => v + [30, 30, 40][i]), 19, t); g.restore(); }
}

/* --- like: the thumbs-up tips back, springs up, fills with colour and bursts */
function drawLike(g, u, t) {
  if (!TINT) return;
  const tip = u < .3 ? -.5 * EASE.out(u / .3) : -.5 + (.5 + .16) * sstep(.3, .62, u) - .16 * sstep(.62, .85, u);          // tips back, springs up past vertical, settles
  const sc = u < .3 ? .88 : 1 + .2 * Math.sin(Math.PI * clamp((u - .3) / .5, 0, 1)) + .03 * Math.sin((u - .8) * 9) * Math.exp(-(u - .8) * 1.2) * (u > .8 ? 1 : 0);
  const e = EASE.io(clamp((u - .42) / .25, 0, 1)), k = 250 / THM.h, dpx = cvs.width / W;
  const bu = (u - .5) / .8; if (bu > 0 && bu < 1) { g.save(); g.strokeStyle = col(AMBER, .9 * (1 - bu)); g.lineWidth = 7 * (1 - bu) + 1; g.beginPath(); g.arc(0, 0, 130 + 100 * EASE.out(bu), 0, TAU); g.stroke();
    g.lineCap = "round"; for (let i = 0; i < 10; i++) { const a = i * TAU / 10 + .2, r0 = 170 + 46 * EASE.out(bu), r1 = r0 + 36 * (1 - bu); g.strokeStyle = col(i % 2 ? [255, 255, 255] : AMBER, .95 * (1 - bu)); g.lineWidth = 7; g.beginPath(); g.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); g.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); g.stroke(); } g.restore(); }
  g.save(); g.translate(0, 4 + 4 * Math.sin(t * 1.9) * (u > 1 ? 1 : 0)); g.rotate(tip); g.scale(sc * k, sc * k); g.translate(-THM.w / 2, -THM.h / 2);

  g.drawImage(TINT.handGrey, 0, 0); g.drawImage(TINT.cuffGrey, 0, 0);
  g.globalAlpha = e; g.drawImage(TINT.handAmber, 0, 0); g.drawImage(TINT.cuffBlue, 0, 0); g.globalAlpha = 1;

  g.save(); g.translate(S.bell[0], S.bell[1]); g.scale(1 + .22 * pulse, 1 + .22 * pulse); g.globalAlpha = 1 - ring * .55 * (1 - Math.abs(sn)); g.translate(-S.bell[0], -S.bell[1]); g.drawImage(AI.subMarks, 0, 0); g.restore();
  g.save(); g.translate(S.bell[0], S.bell[1]); g.rotate(.55 * ring * sn); g.translate(-S.bell[0], -S.bell[1]); g.drawImage(AI.subBell, 0, 0); g.restore();
  const hu = sstep(.08, .5, u), press = sstep(.6, .68, u) * (1 - sstep(.68, .84, u));                       // the hand glides in, presses, and settles
  g.save(); g.globalAlpha = hu; g.translate((1 - EASE.out(hu)) * 70, (1 - EASE.out(hu)) * 55 + 9 * press + (u > .9 ? 2 * Math.sin(t * 3) : 0));
  g.translate(S.tip[0], S.tip[1]); g.scale(1 - .07 * press, 1 - .07 * press); g.translate(-S.tip[0], -S.tip[1]); g.drawImage(AI.subHand, 0, 0); g.restore();
  g.restore();
}

const ICON_Y = 830;
function drawIcons(t) {
  const items = [
    { st: state(CUES.comment, CUES.commentOut, t, .55), x: 960, draw: drawComment },
    { st: state(CUES.like, CUES.iconsOut, t, .5), x: lerp(960, 675, EASE.io(sstep(CUES.sub - .5, CUES.sub + .2, t))), draw: drawLike },
    { st: state(CUES.sub + .12, CUES.iconsOut, t, .5), x: 1128, draw: drawSub },
  ];
  for (const it of items) { if (!it.st) continue; const s = it.st; ctx.save(); ctx.translate(it.x, ICON_Y + s.dy); ctx.scale(s.s, s.s); ctx.globalAlpha = s.a; it.draw(ctx, s.u, t); ctx.restore(); }
}

/* ---------------------------------------------------------------- the picture */
function drawBackground(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#0a1030"); bg.addColorStop(1, "#16204a"); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const pres = presence(t), gx = 960 + 70 * Math.sin(t * .21), gy = lerp(540, 400, EASE.io(pres)) + 30 * Math.sin(t * .27);        // a soft light behind the title, drifting slowly
  const gl = ctx.createRadialGradient(gx, gy, 60, gx, gy, 980); gl.addColorStop(0, "rgba(86,128,255,.30)"); gl.addColorStop(.55, "rgba(60,90,210,.10)"); gl.addColorStop(1, "rgba(40,60,170,0)"); ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .5, W / 2, H / 2, H * 1.1); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.4)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}
function render(t) {
  if (!TL) return;
  const sc = cvs.width / W;
  ctx.setTransform(sc, 0, 0, sc, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  drawBackground(t); drawTitle(t); drawIcons(t);
  if (loop && t > T_TOTAL - .8) { ctx.fillStyle = `rgba(0,0,0,${(t - (T_TOTAL - .8)) / .8})`; ctx.fillRect(0, 0, W, H); }
}
function resize() {
  K = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cvs.style.width = Math.round(W * K) + "px"; cvs.style.height = Math.round(H * K) + "px";
  cvs.width = Math.round(W * K * dpr); cvs.height = Math.round(H * K * dpr);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  TL = layoutTitle(cvs.width / W); render(simT);
}

/* ---------------------------------------------------------------- playback + UI */
let simT = 0, speed = clamp(parseFloat(params.get("speed")) || 1, .25, 4), paused = false, loop = params.get("loop") === "1", looping = false, lastNow = 0;
const pauseBtn = $("pause"), spd = $("spd"), seek = $("seek"), tt_ = $("tt");
const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function syncUI() { seek.max = T_TOTAL; seek.value = clamp(simT, 0, T_TOTAL); tt_.textContent = fmt(simT) + " / " + fmt(T_TOTAL); }
function ensureLoop() { if (!looping) { looping = true; lastNow = performance.now(); requestAnimationFrame(frame); } }
function setPaused(v) { paused = v; pauseBtn.textContent = paused ? (simT >= T_TOTAL && !loop ? "Replay" : "Play") : "Pause"; if (!paused) ensureLoop(); }
function frame(now) {
  if (paused) { looping = false; return; }
  const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now; simT += dt * speed;
  if (loop && simT >= T_TOTAL) simT -= T_TOTAL;
  if (!loop && simT >= T_TOTAL) { simT = T_TOTAL; render(simT); syncUI(); setPaused(true); looping = false; return; }
  render(simT); syncUI(); requestAnimationFrame(frame);
}
function restart() { simT = 0; if (paused) setPaused(false); else ensureLoop(); render(simT); syncUI(); }
pauseBtn.onclick = () => { if (paused && simT >= T_TOTAL && !loop) restart(); else setPaused(!paused); };
$("replay").onclick = restart;
spd.oninput = () => { speed = +spd.value; $("spdv").textContent = speed.toFixed(2).replace(/0$/, "") + "×"; };
seek.oninput = () => { simT = +seek.value; render(simT); syncUI(); if (paused) pauseBtn.textContent = "Play"; };
$("loop").onchange = e => { loop = e.target.checked; if (loop && paused && simT >= T_TOTAL) setPaused(false); };
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
let idleTimer = 0;
if (params.get("bar") === "0") document.body.classList.add("nobar");
function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer); if (params.get("bar") !== "1") idleTimer = setTimeout(() => document.body.classList.add("idle"), 3500); }
["mousemove", "mousedown", "touchstart"].forEach(ev => addEventListener(ev, wake, { passive: true }));
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); pauseBtn.onclick(); }
  else if (e.key === "r" || e.key === "R") restart();
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("nobar");
  else if (e.key === "f" || e.key === "F") $("fs").click();
  else if (e.key === "ArrowRight") { simT = clamp(simT + 5, 0, T_TOTAL); render(simT); syncUI(); }
  else if (e.key === "ArrowLeft") { simT = clamp(simT - 5, 0, T_TOTAL); render(simT); syncUI(); }
  wake();
});
addEventListener("resize", resize);
$("loop").checked = loop; spd.value = speed; $("spdv").textContent = speed.toFixed(2).replace(/0$/, "") + "×";
{ const t0 = parseFloat(params.get("t")); if (!isNaN(t0)) { simT = clamp(t0, 0, T_TOTAL); paused = true; pauseBtn.textContent = "Play"; } }
loadAssets(() => render(simT));
resize(); syncUI(); wake();
window.__ty = { T_TOTAL, CUES, render, presence, get simT() { return simT; }, setPaused };
if (!paused) ensureLoop();
})();
</script>
