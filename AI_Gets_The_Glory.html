<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Glory of Discovery</title>
<!--
  A story in one frame. On the left, a dim, rainy office where human codebreakers slump over cryptograms they
  can't solve, years of failed attempts piling up on the whiteboard and in the bin. On the right, a press hall
  waiting for big news. The Claude star strolls in from the left with the solved page, waves cheerfully as it
  passes the codebreakers (who are in no mood), climbs onto the stage and takes the flashbulbs, the confetti,
  the trophy and the headlines, while the reporters start asking who really deserves the credit.

  Everything is a pure function of the clock t, so the page can be scrubbed, paused or frozen at any moment.
  Keys: Space pause/play, R replay, <- / -> seek 5 s, H hide controls, F fullscreen.
  URL:  ?t=SECONDS freezes at that moment (for stills), ?loop=1 loops (with a fade), ?speed=2 sets the speed,
        ?bar=0 hides / ?bar=1 pins the controls.
  The star and the whole scene are embedded or drawn in code, so this file works offline.
-->
<style>
  :root { --bg:#1b1916; --panel:#24211d; --ink:#ece6da; --muted:#a1978a; --rule:#3a352e; --accent:#e0714a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0c0b0a; color:var(--ink); overflow:hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#13110f; }
  body.idle { cursor:none; }
  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:14px;
    padding:8px 14px; background:rgba(36,33,29,.88); border:1px solid var(--rule); border-radius:10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition:opacity .5s; max-width:calc(100vw - 20px);
    overflow-x:auto; white-space:nowrap; }
  body.idle #bar, body.nobar #bar { opacity:0; pointer-events:none; }
  #bar button { font:inherit; color:var(--ink); background:#2e2a25; border:1px solid var(--rule); border-radius:6px; padding:5px 11px; cursor:pointer; flex-shrink:0; }
  #bar button:hover { background:#3b362f; }
  #bar label { display:flex; align-items:center; gap:7px; color:var(--muted); flex-shrink:0; }
  #bar output { color:var(--ink); min-width:3.2em; font-variant-numeric:tabular-nums; }
  #bar input[type=range] { accent-color:var(--accent); }
  #seek { width:300px; } #spd { width:100px; }
  #tt { min-width:7em; text-align:center; flex-shrink:0; }
  #bar small { color:var(--muted); flex-shrink:0; }
</style>
</head>
<body>

  <button id="replay" title="R">Replay</button>
  <input id="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="Timeline">
  <output id="tt">0:00</output>
  <label>Speed <input id="spd" type="range" min="0.25" max="4" step="0.05" value="1"><output id="spdv">1.0×</output></label>
  <label><input id="loop" type="checkbox"> Loop</label>
  <button id="fs" title="F">Fullscreen</button>
  <small>H hides controls</small>
</div>
