<title>Urquhart and the Swirl of Ciphers</title>
<!--
  Thomas Urquhart's head (George Glover, 1641) floats inside a swirl of the cipher numbers from both
  the Cyphral Distich (2 lines, 64 numbers) and the Cyfral Octastich (9 lines, 285 numbers).
  Every cipher line is one orbiting ring, numbers in reading order.

  Depth of field: the focal plane is the head. Numbers behind it are sharp (and are hidden by the head);
  numbers that swing toward the camera get progressively blurrier.
  Eyes: the irises are cut out of the engraving and slide inside the eyelids to follow a number.

  Keys: Space pause/play, H hide controls, F fullscreen.
  URL: ?t=SECONDS freezes the sim at that time (for stills), ?bar=1 keeps the controls visible.
  Everything (portrait, eyes, numbers) is embedded, so this file works offline.
-->
<style>

  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0c0b0a; color:var(--ink); overflow:hidden;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#13110f; }
  body.idle { cursor:none; }
  #bar { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:16px;
    padding:8px 14px; background:rgba(36,33,29,.88); border:1px solid var(--rule); border-radius:10px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition:opacity .5s; max-width:calc(100vw - 20px);
    overflow-x:auto; white-space:nowrap; }
  body.idle #bar, body.nobar #bar { opacity:0; pointer-events:none; }
  #bar button { font:inherit; color:var(--ink); background:#2e2a25; border:1px solid var(--rule); border-radius:6px; padding:5px 11px; cursor:pointer; flex-shrink:0; }
  #bar button:hover { background:#3b362f; }
  #bar label { display:flex; align-items:center; gap:7px; color:var(--muted); flex-shrink:0; }
  #bar output { color:var(--ink); min-width:3.2em; font-variant-numeric:tabular-nums; }
  #bar input[type=range] { width:120px; accent-color:var(--accent); }
  .legend { display:flex; align-items:center; gap:14px; color:var(--muted); flex-shrink:0; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  #bar small { color:var(--muted); flex-shrink:0; }
</style>

/* ---------------------------------------------------------------- helpers */
const W = 1920, H = 1080, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rad   = d => d * Math.PI / 180;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(1641);               // fixed seed: same swirl every load
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

/* ---------------------------------------------------------------- scene constants */
const OX = 960, OY = 520;                    // orbit centre (stage px)
const F = 1750;                              // camera focal distance
const ZS = 0.62;                             // depth compression
const ZN = 400;                              // depth (after compression) at which blur is maximal
const B_MAX = 12;                            // gaussian sigma (stage px) at ZN, before the slider
const HS = 1.45;                             // head scale
const HEAD_ANCHOR = [255, 235];              // point of the head image that sits at the orbit centre
const FS = 30;                               // number font size (stage px at scale 1)
const FONT = '"Palatino Linotype", Palatino, "Book Antiqua", "Times New Roman", serif';
const COLORS = { D: "#f2a477", O: "#8fd0ee" };

/* ring look: radius, tilt from edge-on, roll, how far tilt/roll sway, speed. inner -> outer */
const ORDER = ["O8", "O0", "O1", "D0", "O2", "O3", "O4", "D1", "O5", "O6", "O7"];
const LOOK = [          // psi near 0 puts a ring's near side below the head, near 180 above it, near +-90 at the sides
  { a: 380, phi: 52, psi:    0, psiAmp: 14, prec:  0.020 },
  { a: 430, phi: 44, psi:   62, psiAmp: 12, prec: -0.018 },
  { a: 480, phi: 38, psi:  150, psiAmp: 14, prec:  0.014 },
  { a: 530, phi: 47, psi: -110, psiAmp: 10, prec: -0.012 },
  { a: 585, phi: 33, psi:  196, psiAmp: 16, prec:  0     },
  { a: 640, phi: 41, psi:  -64, psiAmp: 10, prec:  0.010 },
  { a: 700, phi: 29, psi:   14, psiAmp: 14, prec:  0     },
  { a: 760, phi: 36, psi:  168, psiAmp: 12, prec:  0     },
  { a: 820, phi: 25, psi:    6, psiAmp: 10, prec:  0     },
  { a: 880, phi: 30, psi: -168, psiAmp:  8, prec:  0     },
  { a: 940, phi: 22, psi:  172, psiAmp:  6, prec:  0     },
];

/* ---------------------------------------------------------------- particles */
const rings = [], P = [];
ORDER.forEach((id, i) => {
  const src = RINGS.find(r => r.id === id), look = LOOK[i];
  const ring = Object.assign({ id, c: src.c, dir: 1, ph1: rnd() * TAU, ph2: rnd() * TAU,
    phiAmp: 5 + rnd() * 4, phiRate: 0.12 + rnd() * 0.1, psiRate: 0.09 + rnd() * 0.1,
    omega: 0.31 * Math.pow(480 / look.a, 0.55), parts: [] }, look);
  const n = src.nums.length, base = rnd() * TAU;
  src.nums.forEach((num, k) => {
    const p = { c: src.c, n: num, key: src.c + num, th0: base + TAU * k / n + (rnd() - .5) * 0.25 * TAU / n,
      rr: 0.94 + rnd() * 0.12, off: (rnd() - .5) * 0.13 * look.a, ph: rnd() * TAU,
      sx: 0, sy: 0, z: 0, s: 1, blur: 0, glow: 0, ring: ring };
    ring.parts.push(p); P.push(p);
  });
  rings.push(ring);
});

function updateParticles(t) {
  for (const r of rings) {
    const phi = rad(r.phi + r.phiAmp * Math.sin(t * r.phiRate + r.ph1));
    const psi = rad(r.psi + r.psiAmp * Math.sin(t * r.psiRate + r.ph2)) + r.prec * t;
    const sp = Math.sin(phi), cp = Math.cos(phi), sy = Math.sin(psi), cy = Math.cos(psi);
    const ux = cy, uy = sy, vx = sp * sy, vy = -sp * cy, vz = cp;
    const nx = uy * vz, ny = -ux * vz, nz = ux * vy - uy * vx;
    const th = r.dir * r.omega * t;
    for (const p of r.parts) {
      const a = th + p.th0, ca = Math.cos(a), sa = Math.sin(a);
      const R = r.a * p.rr * (1 + 0.035 * Math.sin(2 * a + p.ph));
      const x = R * (ca * ux + sa * vx) + p.off * nx;
      const y = R * (ca * uy + sa * vy) + p.off * ny;
      const z = R * (sa * vz) + p.off * nz;
      const ze = z * ZS, s = F / (F - ze);
      p.sx = OX + x * s; p.sy = OY - y * s; p.z = ze; p.s = s;
      p.blur = Blur.amount * B_MAX * Math.pow(clamp(ze / ZN, 0, 1), 1.2);
    }
  }
}

const NL = SIG.length;
let sprites = new Map(), spriteQ = 0;
const mctx = document.createElement("canvas").getContext("2d");

function drawShadowOnly(c, text, x, y, color, sigmaPx, reps) {
  // text is drawn far off-canvas; only its (gaussian) shadow lands on the canvas
  const OFF = 12000;
  c.save(); c.shadowColor = color; c.shadowBlur = sigmaPx * 2; c.shadowOffsetX = OFF; c.shadowOffsetY = 0;
  c.fillStyle = "#000";
  for (let i = 0; i < reps; i++) c.fillText(text, x - OFF, y);
  c.restore();
}
function makeSprite(text, tw, color, L, Q) {
  const sig = SIG[L], res = Q * (sig <= 2 ? 1 : sig <= 6 ? 0.5 : 0.25);
  const pad = Math.ceil(sig * 3) + 5;
  const cv = document.createElement("canvas");
  cv.width = Math.ceil((tw + 2 * pad) * res); cv.height = Math.ceil((FS * 1.3 + 2 * pad) * res);
  const c = cv.getContext("2d");
  c.font = `700 ${FS * res}px ${FONT}`; c.textAlign = "center"; c.textBaseline = "middle";
  const cx = cv.width / 2, cy = cv.height / 2 + FS * res * 0.04;
  if (L === 0) {
    drawShadowOnly(c, text, cx, cy, color + "99", 2.4 * res, 1);          // faint glow
    c.fillStyle = color; c.fillText(text, cx, cy);
  } else {
    const reps = 1 + (sig > 2) + (sig > 5) + (sig > 9);                   // blur spreads energy: compensate
    drawShadowOnly(c, text, cx, cy, color, sig * res, reps);
  }
  return { cv, w: cv.width / res, h: cv.height / res };
}
function buildSprites(Q) {
  spriteQ = Q; sprites = new Map();
  mctx.font = `700 ${FS}px ${FONT}`;
  for (const p of P) {
    if (sprites.has(p.key)) continue;
    const text = String(p.n), tw = mctx.measureText(text).width;
    const arr = []; for (let L = 0; L < NL; L++) arr.push(makeSprite(text, tw, COLORS[p.c], L, Q));
    sprites.set(p.key, arr);
  }
}
function levelFor(sigma) {            // fractional level for a sprite-space sigma
  if (sigma <= 0) return 0;
  if (sigma >= SIG[NL - 1]) return NL - 1;
  let i = 1; while (SIG[i] < sigma) i++;
  return i - 1 + (sigma - SIG[i - 1]) / (SIG[i] - SIG[i - 1]);
}

/* ---------------------------------------------------------------- head + eyes */
const img = { head: new Image(), L: new Image(), R: new Image() };
function smoothPath(pts) {            // closed Catmull-Rom spline through the eyelid outline
  const p = new Path2D(), n = pts.length;
  p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    p.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6,
                    p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  p.closePath(); return p;
}
const eyeClip = {};
const EYE_X = [-8, 6], EYE_Y = [-1.2, 1.2];     // travel of the iris (head-image px) around its engraved position

/* ---------------------------------------------------------------- gaze */
const gaze = { x: 0, y: 0, tx: 0, ty: 0, target: null, side: 1, dwell: 0, sacc: 0, micro: 0, nx: 0 };
const head = { x: OX, y: OY, rot: 0, eyeX: 0, eyeY: 0 };
function headMatrix(bobY, rot, dx) {  // maps head-image px -> stage px
  const c = Math.cos(rot) * HS, s = Math.sin(rot) * HS;
  return { a: c, b: s, c: -s, d: c, e: OX + dx, f: OY + bobY, ax: HEAD_ANCHOR[0], ay: HEAD_ANCHOR[1] };
}
const toStage = (m, x, y) => ({ x: m.e + m.a * (x - m.ax) + m.c * (y - m.ay), y: m.f + m.b * (x - m.ax) + m.d * (y - m.ay) });

function insideHead(p) { const dx = (p.sx - OX) / 270, dy = (p.sy - (OY + 20)) / 330; return dx * dx + dy * dy < 1; }
function pickTarget(eye) {
  let best = null, bestScore = -1e9;
  for (const p of P) {
    if (p.z < 0 && insideHead(p)) continue;                    // hidden behind the head
    const dx = p.sx - eye.x, dy = p.sy - eye.y;
    if (Math.abs(dx) < 240 || Math.abs(dy) > 340 || p.sx < 90 || p.sx > W - 90 || p.sy < 90 || p.sy > H - 90) continue;
    let score = rnd();
    if (Math.sign(dx) === -gaze.side) score += 1.0;            // look back and forth: prefer the other side
    score += p.z < 130 ? 0.7 : -0.3 * clamp((p.z - 130) / 200, 0, 1);   // prefer numbers he can actually read (in focus)
    if (p === gaze.target) score -= 5;
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return best;
}
function updateGaze(dt, simT) {
  const m = headMatrix(head.bobY || 0, head.rot, head.dx || 0);
  const eye = toStage(m, (EYE.L.home[0] + EYE.R.home[0]) / 2, (EYE.L.home[1] + EYE.R.home[1]) / 2);
  gaze.dwell -= dt; gaze.sacc = Math.max(0, gaze.sacc - dt);
  if (gaze.dwell <= 0 || !gaze.target) {
    const t = pickTarget(eye);
    if (t) { gaze.target = t; gaze.side = Math.sign(t.sx - eye.x) || 1; gaze.sacc = 0.2; }
    gaze.dwell = 0.75 + rnd() * 0.95;
  }
  const t = gaze.target;
  if (t) {
    const dx = t.sx - eye.x, dy = t.sy - eye.y, mx = Math.tanh(dx / 330);
    gaze.tx = mx > 0 ? mx * EYE_X[1] : -mx * EYE_X[0];
    gaze.ty = Math.tanh(dy / 300) * EYE_Y[1];
    gaze.nx = mx;
  }
  gaze.micro -= dt;                                            // tiny involuntary jitter
  if (gaze.micro <= 0) { gaze.jx = (rnd() - .5) * 0.5; gaze.jy = (rnd() - .5) * 0.3; gaze.micro = 0.25 + rnd() * 0.5; }
  const k = 1 - Math.exp(-dt / (gaze.sacc > 0 ? 0.03 : 0.13));
  gaze.x += (gaze.tx + (gaze.jx || 0) - gaze.x) * k;
  gaze.y += (gaze.ty + (gaze.jy || 0) - gaze.y) * k;
  for (const p of P) p.glow += ((p === t ? 1 : 0) - p.glow) * (1 - Math.exp(-dt / (p === t ? 0.12 : 0.5)));
  // the head turns a touch toward whatever it is looking at, and bobs
  head.bobY = 5 * Math.sin(simT * 0.9) + 2 * Math.sin(simT * 1.7);
  head.rot = lerp(head.rot, 0.016 * gaze.nx + 0.004 * Math.sin(simT * 0.6), 1 - Math.exp(-dt / 0.35));
  head.dx = lerp(head.dx || 0, 5 * gaze.nx, 1 - Math.exp(-dt / 0.35));
}

/* ---------------------------------------------------------------- state / controls */
const Blur = { amount: 1 };
let simT = 0, speed = 1, paused = false;
const cvs = $("c"), ctx = cvs.getContext("2d");
let K = 1, bg = null;

function makeBackground(scale) {
  const cv = document.createElement("canvas"); cv.width = Math.round(W * scale); cv.height = Math.round(H * scale);
  const c = cv.getContext("2d"); c.scale(scale, scale);
  c.fillStyle = "#12100e"; c.fillRect(0, 0, W, H);
  let g = c.createRadialGradient(OX, OY - 20, 40, OX, OY - 20, 760);   // warm light behind the head
  g.addColorStop(0, "#4a3d30"); g.addColorStop(0.3, "#2c241d"); g.addColorStop(0.7, "#17130f"); g.addColorStop(1, "#0d0b09");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  g = c.createRadialGradient(W / 2, H / 2, H * 0.55, W / 2, H / 2, H * 1.15);  // vignette
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.55)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  return cv;
}
function resize() {
  K = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cvs.style.width = Math.round(W * K) + "px"; cvs.style.height = Math.round(H * K) + "px";
  cvs.width = Math.round(W * K * dpr); cvs.height = Math.round(H * K * dpr);
  const scale = cvs.width / W;
  bg = makeBackground(scale);
  const Q = clamp(Math.round(scale * 2) / 2, 1, 2);
  if (Q !== spriteQ) buildSprites(Q);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  render();
}

/* ---------------------------------------------------------------- render */
function drawNumber(p, alphaMul) {
  const arr = sprites.get(p.key); if (!arr) return;
  const zn = clamp(p.z / ZN, 0, 1);
  let alpha = p.z < 0 ? lerp(1, 0.62, clamp(-p.z / 420, 0, 1)) : 1 - 0.2 * zn;    // far ones dim a little
  alpha *= alphaMul;
  const f = levelFor(p.blur / p.s), l0 = Math.floor(f), t = f - l0;
  const draw = (sp, a) => {
    if (a <= 0.01) return;
    ctx.globalAlpha = a; const w = sp.w * p.s, h = sp.h * p.s;
    ctx.drawImage(sp.cv, p.sx - w / 2, p.sy - h / 2, w, h);
  };
  draw(arr[l0], alpha * (1 - t));
  if (t > 0.01 && l0 + 1 < NL) draw(arr[l0 + 1], alpha * t);
  if (p.glow > 0.02) {                                                   // the number he is looking at lights up a little
    ctx.globalCompositeOperation = "lighter";
    draw(arr[l0], 0.55 * p.glow * alpha * (1 - t)); if (t > 0.01 && l0 + 1 < NL) draw(arr[l0 + 1], 0.55 * p.glow * alpha * t);
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.globalAlpha = 1;
}
function drawHead() {
  const m = headMatrix(head.bobY || 0, head.rot, head.dx || 0);
  ctx.save();
  ctx.imageSmoothingQuality = "high";
  ctx.transform(m.a, m.b, m.c, m.d, m.e - m.a * m.ax - m.c * m.ay, m.f - m.b * m.ax - m.d * m.ay);
  ctx.drawImage(img.head, 0, 0);
  for (const k of ["L", "R"]) {
    const e = EYE[k], S = e.sprite;
    ctx.save(); ctx.clip(eyeClip[k]);
    ctx.drawImage(img[k], e.home[0] + gaze.x - S[0] / 2, e.home[1] + gaze.y - S[1] / 2, S[0], S[1]);
    ctx.restore();
  }
  ctx.restore();
}
const sorted = P.slice();
function render() {
  if (!img.head.complete || !bg) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(bg, 0, 0, cvs.width, cvs.height);
  const sc = cvs.width / W; ctx.setTransform(sc, 0, 0, sc, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "medium";
  sorted.sort((a, b) => a.z - b.z);
  let i = 0;
  for (; i < sorted.length && sorted[i].z < 0; i++) drawNumber(sorted[i], 1);   // behind the head (sharp)
  drawHead();
  for (; i < sorted.length; i++) drawNumber(sorted[i], 1);                      // in front of the head (blurred)
}

/* ---------------------------------------------------------------- main loop */
function step(dt) {
  simT += dt * speed;
  updateParticles(simT);
  updateGaze(dt, simT);
}
let last = performance.now(), looping = false;
function ensureLoop() { if (!looping) { looping = true; last = performance.now(); requestAnimationFrame(frame); } }
function frame(now) {
  if (paused) { looping = false; return; }                 // no frames are produced while paused
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); render();
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- UI */
const pauseBtn = $("pause"), spd = $("spd"), blr = $("blr");
function setPaused(v) { paused = v; pauseBtn.textContent = paused ? "Play" : "Pause"; if (!paused) ensureLoop(); }
pauseBtn.onclick = () => setPaused(!paused);
spd.oninput = () => { speed = +spd.value; $("spdv").textContent = speed.toFixed(2).replace(/0$/, "") + "×"; if (paused) { updateParticles(simT); render(); } };
blr.oninput = () => { Blur.amount = +blr.value; $("blrv").textContent = Blur.amount.toFixed(2).replace(/0$/, "") + "×"; updateParticles(simT); render(); };
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
let idleTimer = 0;
if (params.get("bar") === "0") document.body.classList.add("nobar");
function wake() { document.body.classList.remove("idle"); clearTimeout(idleTimer); if (params.get("bar") !== "1") idleTimer = setTimeout(() => document.body.classList.add("idle"), 3500); }
["mousemove", "mousedown", "touchstart"].forEach(ev => addEventListener(ev, wake, { passive: true }));
addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); setPaused(!paused); }
  else if (e.key === "h" || e.key === "H") document.body.classList.toggle("nobar");
  else if (e.key === "f" || e.key === "F") $("fs").click();
  wake();
});
addEventListener("resize", resize);

/* ---------------------------------------------------------------- start */
function load(el, src) { return new Promise((res, rej) => { el.onload = res; el.onerror = rej; el.src = src; }); }
Promise.all([load(img.head, SRC.head), load(img.L, SRC.L), load(img.R, SRC.R)]).then(() => {
  for (const k of ["L", "R"]) eyeClip[k] = smoothPath(EYE[k].poly);
  const t0 = parseFloat(params.get("t"));
  if (!isNaN(t0)) { setPaused(true); const n = Math.round(t0 * 60); for (let i = 0; i < n; i++) step(1 / 60); }
  updateParticles(simT);
  resize();
  wake();
  window.__urq = { P, rings, gaze, head, step, render, get simT() { return simT; }, setPaused, EYE };
  if (!paused) ensureLoop();
});
})();
</script>
